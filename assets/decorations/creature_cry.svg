<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- Soft blush filter -->
    <filter id="cry-blush-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
    </filter>
    <!-- Eye gradient -->
    <radialGradient id="cry-eye-shading" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3a0c12" />
      <stop offset="50%" stop-color="#180406" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <!-- Tear shimmer gradient -->
    <linearGradient id="tear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bce3fd" />
      <stop offset="60%" stop-color="#70b9fa" />
      <stop offset="100%" stop-color="#4d9be6" />
    </linearGradient>
  </defs>

  <!-- Puddle at bottom -->
  <path d="M 40 215 C 20 220 25 240 60 242 C 95 244 140 246 185 243 C 225 240 245 228 220 216 C 190 205 160 212 130 210 C 90 208 65 210 40 215 Z"
        fill="url(#tear-grad)" opacity="0.85" stroke="#317bc2" stroke-width="2" />
  <!-- Puddle ripple highlight -->
  <ellipse cx="120" cy="225" rx="55" ry="8" fill="#FFFFFF" opacity="0.4" />

  <g transform="translate(10, 0)">
    <!-- Body and limbs -->
    <!-- Torso / Head -->
    <path d="M 85 145 C 70 120 68 70 130 67 C 192 70 190 120 175 145 C 170 165 165 190 130 190 C 95 190 90 165 85 145 Z" 
          fill="#FFFFFF" stroke="#18181B" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Sad drooping arms -->
    <path d="M 86 142 C 78 152 76 168 84 175 C 90 180 96 172 95 160 Z" 
          fill="#FFFFFF" stroke="#18181B" stroke-width="4" stroke-linejoin="round" />
    <path d="M 174 142 C 182 152 184 168 176 175 C 170 180 164 172 165 160 Z" 
          fill="#FFFFFF" stroke="#18181B" stroke-width="4" stroke-linejoin="round" />

    <!-- Sad little feet -->
    <path d="M 100 185 L 98 205 C 98 212 110 214 116 208 C 120 202 122 192 125 186 C 128 186 132 186 135 186 C 138 192 140 202 144 208 C 150 214 162 212 162 205 L 160 185 Z" 
          fill="#FFFFFF" stroke="#18181B" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Sad tilted eyebrows -->
    <path d="M 92 88 Q 102 82 112 88" fill="none" stroke="#18181B" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 148 88 Q 158 82 168 88" fill="none" stroke="#18181B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Rosy Cheek blush -->
    <ellipse cx="80" cy="150" rx="16" ry="10" fill="#ff4d6d" opacity="0.6" filter="url(#cry-blush-glow)" />
    <ellipse cx="180" cy="150" rx="16" ry="10" fill="#ff4d6d" opacity="0.6" filter="url(#cry-blush-glow)" />

    <!-- Giant teary LEFT EYE -->
    <g transform="translate(62, 94)">
      <ellipse cx="32" cy="32" rx="30" ry="30" fill="url(#cry-eye-shading)" stroke="#18181B" stroke-width="4" />
      <!-- Watery shine bubbles -->
      <ellipse cx="24" cy="22" rx="10" ry="12" fill="#FFFFFF" opacity="0.9" transform="rotate(-15 24 22)" />
      <circle cx="40" cy="42" r="5" fill="#FFFFFF" opacity="0.85" />
      <circle cx="20" cy="38" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Giant teary RIGHT EYE -->
    <g transform="translate(130, 94)">
      <ellipse cx="32" cy="32" rx="30" ry="30" fill="url(#cry-eye-shading)" stroke="#18181B" stroke-width="4" />
      <!-- Watery shine bubbles -->
      <ellipse cx="24" cy="22" rx="10" ry="12" fill="#FFFFFF" opacity="0.9" transform="rotate(-15 24 22)" />
      <circle cx="40" cy="42" r="5" fill="#FFFFFF" opacity="0.85" />
      <circle cx="20" cy="38" r="4" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Sad trembling mouth -->
    <path d="M 124 158 Q 130 152 136 158" fill="none" stroke="#18181B" stroke-width="3.5" stroke-linecap="round" />

    <!-- TEAR STREAMS (Left) -->
    <path d="M 82 125 C 72 145 68 175 62 210 C 65 212 72 212 74 208 C 78 185 88 155 92 130 Z" 
          fill="url(#tear-grad)" opacity="0.9" />
    <path d="M 72 138 C 70 148 71 160 74 168" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- TEAR STREAMS (Right) -->
    <path d="M 178 125 C 188 145 192 175 198 210 C 195 212 188 212 186 208 C 182 185 172 155 168 130 Z" 
          fill="url(#tear-grad)" opacity="0.9" />
    <path d="M 188 138 C 190 148 189 160 186 168" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
