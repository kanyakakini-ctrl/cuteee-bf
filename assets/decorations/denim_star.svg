<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Denim pattern -->
    <pattern id="denim-twill" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0 M0 3 L3 0 M3 6 L6 3" stroke="#253d5a" stroke-width="1.2" opacity="0.4" />
      <path d="M-1 1 L1 -1 M5 7 L7 5" stroke="#1d3047" stroke-width="1.2" opacity="0.3" />
    </pattern>
    <filter id="star-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#0a121e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Star Shape (Denim Base) -->
  <polygon points="50,5 64,36 98,38 72,61 80,95 50,76 20,95 28,61 2,38 36,36"
           fill="#466995" filter="url(#star-shadow)" />

  <!-- Denim Texture Overlay -->
  <polygon points="50,5 64,36 98,38 72,61 80,95 50,76 20,95 28,61 2,38 36,36"
           fill="url(#denim-twill)" opacity="0.9" />

  <!-- White Running Stitch Line -->
  <polygon points="50,11 62,38 90,40 68,60 75,88 50,72 25,88 32,60 10,40 38,38"
           fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3.5 2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
</svg>
